# Aggregate event-extraction model -- trains on all 9 event datasets
# combined: wikievents, rams, maven, leven, casie, cmnee, docee,
# events_biotech, ace2005.
#
# IMPORTANT -- trigger_types must be derived from the COMBINED converted
# data across every source below (data/_trigger_types.py's
# derive_trigger_types(), called on the concatenation of all files, or on
# each file with explicit=... for the trigger-only sources: maven, leven,
# events_biotech). Different sources use different event-type taxonomies
# and naming conventions (e.g. ACE2005's "Life.Die" vs. a bare-word MAVEN
# label) -- combining them is a real modeling decision (share the label
# space as literal strings, or normalize/map them first), not something
# this config can resolve for you. Also note: DocEE and events_biotech use
# a synthetic bracketed trigger token, not a real mention -- see
# docs/events.md before including them in a model you intend to deploy on
# real text.
#
# Every source now has a real (leven/maven: train/val only, their test
# splits ship without usable annotations) or, for casie/ace2005/
# events_biotech (no real split upstream), synthetically 80/10/10 split
# train/val/test -- see data/run_all_converters.sh and the individual
# configs/<dataset>.yaml files this was assembled from. Convert each source
# first: entries pointing at files that don't exist yet will fail to load.
model:
  # Model Configuration
  model_name: microsoft/deberta-v3-small # Hugging Face model
  labels_encoder: null  # Set to model name for bi-encoder architecture
  name: "aggregate Events"
  max_width: 12
  hidden_size: 768
  dropout: 0.3
  fine_tune: true
  subtoken_pooling: first
  fuse_layers: false
  represent_spans: false
  post_fusion_schema: null  # e.g., "l2l-l2t-t2t"
  span_mode: markerV0  # Options: token_level | markerV0
  max_types: 100
  max_len: 512
  max_neg_type_ratio: 1
  relations_layer: "dot"  # Options: dot | mlp | bilinear (bipartite mode -- gcn/gat/attention unsupported)
  triples_layer: null
  event_mode: true
  trigger_types: []  # REQUIRED -- see the IMPORTANT note above. Do not leave empty.

data:
  # Directory Paths
  root_dir: gliner_logs/aggregate_events
  train_data:
    - "data/wikievents.train.jsonl"
    - "data/rams.train.jsonl"
    - "data/maven.train.jsonl"
    - "data/leven.train.jsonl"
    - "data/casie.train.jsonl"
    - "data/cmnee.train.jsonl"
    - "data/docee.train.jsonl"
    - "data/events_biotech.train.jsonl"
    - "data/ace2005.train.jsonl"
  val_data:
    - "data/wikievents.val.jsonl"
    - "data/rams.val.jsonl"
    - "data/maven.val.jsonl"
    - "data/leven.val.jsonl"
    - "data/casie.val.jsonl"
    - "data/cmnee.val.jsonl"
    - "data/docee.val.jsonl"
    - "data/events_biotech.val.jsonl"
    - "data/ace2005.val.jsonl"
  test_data:
    - "data/wikievents.test.jsonl"
    - "data/rams.test.jsonl"
    - "data/casie.test.jsonl"
    - "data/cmnee.test.jsonl"
    - "data/docee.test.jsonl"
    - "data/events_biotech.test.jsonl"
    - "data/ace2005.test.jsonl"

training:
  # Pretrained Model Path
  prev_path: null  # Use null for training from scratch, or path/repo for fine-tuning

  # Training Parameters
  num_epochs: 15  # Evaluated at the end of every epoch, not by step.
  early_stopping_patience: 3  # Stop after 3 evals with no F1 improvement.
  train_batch_size: 8
  gradient_accumulation_steps: 1  # Effective batch size = train_batch_size x this. Raise to grow the effective batch without more memory.
  window_stride: null  # Overlap (word tokens) between sliding-window chunks for documents
    # longer than max_len. null = auto (max_len // 4 = 128 here). Lower = more overlap/windows.
  eval_by_language: false  # If true, blind test prints a per-language breakdown, then all combined
  threshold: 0.5  # Decision threshold for entity/relation/adjacency decoding.
  threshold_sweep: false  # If true (default 5-point grid) or a list of candidate
    # thresholds (e.g. [0.2, 0.3, 0.4]), calibrate against val_data after training
    # and use the best-scoring threshold for the blind test instead of threshold above.
  warmup_ratio: 0.05
  scheduler_type: "cosine"  # Options: linear, cosine, constant

  # Loss Function Configuration
  loss_alpha: 0.75
  loss_gamma: 0
  loss_prob_margin: 0
  label_smoothing: 0
  loss_reduction: "sum"
  negatives: 1.0
  masking: 'none'

  # Learning Rate and Weight Decay
  lr_encoder: 1e-5
  lr_others: 3e-5
  weight_decay_encoder: 0.1
  weight_decay_other: 0.01
  max_grad_norm: 10.0

  # Checkpoint Management
  save_total_limit: 3  # Maximum number of checkpoints to save

  # Advanced Training Settings
  size_sup: -1
  shuffle_types: true
  random_drop: true

  freeze_components: null  # Examples: ['text_encoder']
