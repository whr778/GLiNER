# casie -- event extraction (trigger/argument).
# No real train/val/test split exists upstream -- one converter run produces all three via a synthetic 80/10/10
# (see data/_jsonl.py's SplitWriter). Convert first: uv run python data/convert_casie.py --out data/casie.jsonl
# (see data/run_all_converters.sh, docs/data_converters.md for source/license).
model:
  # Model Configuration
  model_name: microsoft/deberta-v3-small # Hugging Face model
  labels_encoder: null  # Set to model name for bi-encoder architecture
  name: "casie Events"
  max_width: 12
  hidden_size: 768
  dropout: 0.3
  fine_tune: true
  subtoken_pooling: first
  fuse_layers: false
  represent_spans: false
  post_fusion_schema: null  # e.g., "l2l-l2t-t2t"
  span_mode: markerV0  # Options: token_level | markerV0
  max_types: 100
  max_len: 512
  max_neg_type_ratio: 1
  relations_layer: "dot"  # Options: dot | mlp | bilinear (bipartite mode -- gcn/gat/attention unsupported)
  triples_layer: null
  event_mode: true
  # Under loss_reduction: sum the NER span loss is ~300x larger than the event
  # (adjacency/role) losses -- measured on WikiEvents -- so at coef 1.0 the event
  # heads barely train while entity NER dominates. Upweight the event losses.
  # Starting points; tune by watching whether adj_loss/rel_loss actually fall.
  adjacency_loss_coef: 50   # trigger <-> argument linking
  relation_loss_coef: 50    # argument-role classification
  trigger_types: []  # Auto-derived from training-relation heads when left empty
    # (train.py / custom_train.py). Relation-less event datasets (MAVEN, LEVEN,
    # events_biotech) have nothing to derive from -- set their types explicitly.

data:
  # Directory Paths
  root_dir: gliner_logs/casie
  train_data: "data/casie.train.jsonl"
  val_data: "data/casie.val.jsonl"  # Set to validation data path, list of paths, or "none"
  test_data: "data/casie.test.jsonl"  # Set to test data path, list of paths, or "none" -- enables the blind test

training:
  # Pretrained Model Path
  prev_path: null  # Use null for training from scratch, or path/repo for fine-tuning

  # Training Parameters
  num_epochs: 15  # Evaluated at the end of every epoch, not by step.
  early_stopping_patience: 5  # Stop after N evals with no F1 improvement. Kept
    # generous for events: entity NER plateaus early while event roles learn
    # slower, so a tight patience can halt before roles improve.
  # Checkpoint/early-stopping F1 = (1 - rel_metric_weight)*entity_F1 +
  # rel_metric_weight*role_F1. 0.5 = plain average (entity NER dominates).
  # Higher weights the event-role side so the tracked metric keeps improving
  # while roles are still learning, instead of following entity NER.
  rel_metric_weight: 0.7
  train_batch_size: 8
  gradient_accumulation_steps: 1  # Effective batch size = train_batch_size x this. Raise to grow the effective batch without more memory.
  window_stride: null  # Overlap (word tokens) between sliding-window chunks for documents
    # longer than max_len. null = auto (max_len // 4 = 128 here). Lower = more overlap/windows.
  eval_by_language: false  # If true, blind test prints a per-language breakdown, then all combined
  threshold: 0.5  # Decision threshold for entity/relation/adjacency decoding.
  threshold_sweep: false  # If true (default 5-point grid) or a list of candidate
    # thresholds (e.g. [0.2, 0.3, 0.4]), calibrate against val_data after training
    # and use the best-scoring threshold for the blind test instead of threshold above.
  warmup_ratio: 0.05
  scheduler_type: "cosine"  # Options: linear, cosine, constant

  # Loss Function Configuration
  loss_alpha: 0.75
  loss_gamma: 0
  loss_prob_margin: 0
  label_smoothing: 0
  loss_reduction: "sum"
  negatives: 1.0
  masking: 'none'

  # Learning Rate and Weight Decay
  lr_encoder: 1e-5
  lr_others: 3e-5
  weight_decay_encoder: 0.1
  weight_decay_other: 0.01
  max_grad_norm: 10.0

  # Checkpoint Management
  save_total_limit: 3  # Maximum number of checkpoints to save

  # Advanced Training Settings
  size_sup: -1
  shuffle_types: true
  random_drop: true

  freeze_components: null  # Examples: ['text_encoder']
